
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branchbound</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>BRANCHBOUND</h1>
    <p>Build your own progression.</p>
  </header>

  <main>
    <section class="stats">
      <h2>💎 <span id="shards">0</span> Shards</h2>
      <h3>⚡ <span id="income">0</span> / second</h3>
    </section>

    <button id="tapButton">✦ GATHER SHARDS</button>

    <h2>🌳 Upgrade Tree</h2>
    <p>Unlock connected nodes to expand your network.</p>

    <div id="upgradeTree" class="tree">
      <svg id="connections"></svg>
      <div id="nodes"></div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
